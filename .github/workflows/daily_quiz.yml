name: Daily English Quiz

on:
  schedule:
    # 파리 16:00 — 서머타임(CEST)일 때
    - cron: "0 14 * * 1-5"
    # 파리 16:00 — 표준시(CET)일 때
    - cron: "0 15 * * 1-5"
  workflow_dispatch:

jobs:
  # 파리 현지 16시일 때만 통과시킨다 (수동 실행은 항상 통과)
  check-time:
    runs-on: ubuntu-latest
    outputs:
      proceed: ${{ steps.t.outputs.proceed }}
    steps:
      - id: t
        run: |
          PARIS_HOUR=$(TZ=Europe/Paris date +%H)
          echo "Paris time: $(TZ=Europe/Paris date '+%Y-%m-%d %H:%M %Z')"
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "Manual run — proceeding."
            echo "proceed=true" >> "$GITHUB_OUTPUT"
          elif [ "$PARIS_HOUR" = "16" ]; then
            echo "Scheduled run at 16h Paris — proceeding."
            echo "proceed=true" >> "$GITHUB_OUTPUT"
          else
            echo "Not 16h in Paris — skipping."
            echo "proceed=false" >> "$GITHUB_OUTPUT"
          fi

  generate-and-send:
    needs: check-time
    if: needs.check-time.outputs.proceed == 'true'
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install anthropic feedparser pyyaml

      - name: Generate quiz & send email
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          RECIPIENT_EMAIL: ${{ secrets.RECIPIENT_EMAIL }}
          PAGES_BASE_URL: ${{ secrets.PAGES_BASE_URL }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python quiz_generator/generate_quiz.py

      - name: Commit quiz JSON
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/quiz/
          git stash
          git pull --rebase origin main
          git stash pop || true
          git add docs/quiz/
          git diff --cached --quiet || git commit -m "quiz: $(date +%Y-%m-%d)"
          git push
