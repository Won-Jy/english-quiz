name: Daily English Quiz

on:
  schedule:
    # 파리 16:10 — 서머타임(CEST, UTC+2)
    - cron: "10 14 * * 1-5"
    # 파리 16:10 — 표준시(CET, UTC+1)
    - cron: "10 15 * * 1-5"
  workflow_dispatch:

jobs:
  # 두 크론 중 지금 계절에 맞는 쪽만 통과시킨다.
  # 실행 시각이 아니라 "어느 크론이 트리거했는지"로 판단하므로
  # GitHub 예약 실행이 몇 시간 밀려도 정상 발송된다.
  check-schedule:
    runs-on: ubuntu-latest
    outputs:
      proceed: ${{ steps.t.outputs.proceed }}
    steps:
      - id: t
        env:
          SCHEDULE: ${{ github.event.schedule }}
        run: |
          OFFSET=$(TZ=Europe/Paris date +%z)
          echo "Paris now : $(TZ=Europe/Paris date '+%Y-%m-%d %H:%M %Z') (UTC${OFFSET})"
          echo "Event     : ${{ github.event_name }}"
          echo "Schedule  : ${SCHEDULE:-<none>}"

          PROCEED=false
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "→ 수동 실행: 진행"
            PROCEED=true
          elif [ "$SCHEDULE" = "10 14 * * 1-5" ] && [ "$OFFSET" = "+0200" ]; then
            echo "→ 서머타임 크론 + 현재 CEST: 진행"
            PROCEED=true
          elif [ "$SCHEDULE" = "10 15 * * 1-5" ] && [ "$OFFSET" = "+0100" ]; then
            echo "→ 표준시 크론 + 현재 CET: 진행"
            PROCEED=true
          else
            echo "→ 이번 계절에 맞지 않는 크론: 건너뜀"
          fi
          echo "proceed=$PROCEED" >> "$GITHUB_OUTPUT"

  generate-and-send:
    needs: check-schedule
    if: needs.check-schedule.outputs.proceed == 'true'
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install anthropic feedparser pyyaml

      - name: Generate quiz & send email
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          RECIPIENT_EMAIL: ${{ secrets.RECIPIENT_EMAIL }}
          PAGES_BASE_URL: ${{ secrets.PAGES_BASE_URL }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python quiz_generator/generate_quiz.py

      - name: Commit quiz JSON
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/quiz/
          git stash
          git pull --rebase origin main
          git stash pop || true
          git add docs/quiz/
          git diff --cached --quiet || git commit -m "quiz: $(date +%Y-%m-%d)"
          git push
