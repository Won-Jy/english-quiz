name: Daily English Quiz

on:
  schedule:
    # 프랑스 여름시간(CEST) 23:00 = UTC 21:00
    - cron: "0 21 * * 1-5"
  workflow_dispatch:

jobs:
  generate-and-send:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install anthropic feedparser pyyaml

      - name: Generate quiz & send email
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          RECIPIENT_EMAIL: ${{ secrets.RECIPIENT_EMAIL }}
          PAGES_BASE_URL: ${{ secrets.PAGES_BASE_URL }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python quiz_generator/generate_quiz.py

      - name: Commit quiz JSON
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/quiz/
          git stash
          git pull --rebase origin main
          git stash pop || true
          git add docs/quiz/
          git diff --cached --quiet || git commit -m "quiz: $(date +%Y-%m-%d)"
          git push
